<section id="tariffs">
    <div class="container">

        <div class="title title--white">
            <h2>Наши тарифы</h2>
            <span>Главное в бизнесе — люди</span>
        </div>

        <div class="routes__controls">

            <div class="routes__select">
                <label for="fromSelect">Откуда:</label>
                <select id="fromSelect" name="from">
                    <option value="Шанхай" selected>Шанхай</option>
                    <option value="Маньчжурия">Маньчжурия</option>
                    <option value="Дуннин">Дуннин</option>
                    <option value="Хэйхэ">Хэйхэ</option>
                    <option value="Чэнду">Чэнду</option>
                    <option value="Пекин">Пекин</option>
                    <option value="Харбин">Харбин</option>
                    <option value="Нинбо">Нинбо</option>
                    <option value="Циндао">Циндао</option>
                    <option value="Сямынь">Сямынь</option>
                    <option value="Тяньцзинь">Тяньцзинь</option>
                    <option value="Шэньчжэнь">Шэньчжэнь</option>
                    <option value="Наньша">Наньша</option>
                    <option value="Варшава">Варшава</option>
                    <option value="Вильнюс">Вильнюс</option>
                    <option value="Берлин">Берлин</option>
                    <option value="Милан">Милан</option>
                </select>
            </div>

            <!-- 🔹 Блок со всеми селектами "куда" (по каждому городу "откуда") -->
            <div class="routes__selects-group">

                <div class="routes__select active" id="Шанхай">
                    <label>Куда:</label>
                    <select>
                        <option value="Маньчжурия" selected>Маньчжурия</option>
                        <option value="Москва">Москва</option>
                        <option value="Новороссийск">Новороссийск</option>
                        <option value="Санкт-Петербург">Санкт-Петербург</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="routes__tables">

            <table class="table table-hover" id="Шанхай_Москва">
                <thead>
                <tr>
                    <th scope="col">Тип перевозки</th>
                    <th scope="col">Стоимость</th>
                    <th scope="col">Единица измерения</th>
                    <th scope="col">Сроки</th>
                </tr>
                </thead>
                <tbody>
                <tr class="avia">
                    <th scope="row">
                        <span>Авиа</span>
                    </th>
                    <td>$2,55</td>
                    <td>$ / кг</td>
                    <td>1-2 дня</td>
                </tr>
                <tr class="train">
                    <th scope="row">
                        <span>Прямое ж/д генеральное</span>
                    </th>
                    <td>$3000</td>
                    <td>40'HC</td>
                    <td>20-25 дней</td>
                </tr>
                <tr class="ship">
                    <th scope="row">
                        <span>Море генеральное</span>
                    </th>
                    <td>$3000</td>
                    <td>20'DC</td>
                    <td>30-35 дней</td>
                </tr>
                <tr class="ship">
                    <th scope="row"></th>
                    <td>$4000</td>
                    <td>40'HC</td>
                    <td>30-35 дней</td>
                </tr>
                </tbody>
            </table>

        </div>

    </div>

</section>
