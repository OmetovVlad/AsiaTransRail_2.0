<!-- Рассчитать стоимость -->
<div class="modal fade" id="staticBackdrop" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Рассчитать стоимость</span>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="subtitle mini">Заполните форму и мы свяжемся с вами в ближайшее время</div>

                <form class="needs-validation" novalidate>
                    <div>
                        <input name="name" type="text" placeholder="Ваше имя">
                    </div>
                    <div>
                        <input name="phone" type="text" placeholder="Номер телефона" class="phone" maxlength="18" minlength="18" required>
                        <div class="invalid-feedback">
                            Введите корректный номер телефона
                        </div>
                    </div>
                    <div>
                        <input name="email" type="email" placeholder="E-mail">
                    </div>
                    <div>
                        <textarea name="message" placeholder="Ваш запрос"></textarea>
                    </div>
                    <div class="approve">
                        <label class="form-check">
                            <input type="checkbox" name="isagree" required>
                            <span>
                                Я даю <a href="/consent-personal-data.pdf" target="_blank">согласие</a> на обработку моих персональных данных в соответствии с <a href="/privacy.pdf" target="_blank">политикой конфиденциальности</a>.
                            </span>
                        </label>
                    </div>
                    <div>
                        <button class="button" type="submit"><span>Отправить</span></button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
